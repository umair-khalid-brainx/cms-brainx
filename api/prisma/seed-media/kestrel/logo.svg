  </g>
  <path d="M20 31 V45" stroke="#E6EAEF" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="20" cy="45" r="2.2" fill="none" stroke="#E6EAEF" stroke-width="1.4"/>
  <text x="50" y="27" fill="#E6EAEF" font-family="'Archivo Narrow', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">KESTREL</text>
  <text x="51" y="42" fill="#8E9AAA" font-family="'Archivo Narrow', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="4.2">RIGGING</text>
</svg>
