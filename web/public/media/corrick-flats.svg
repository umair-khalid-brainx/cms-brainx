<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Tidal flats at low water with oyster cage rows">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C3D2CB"/>
      <stop offset="0.62" stop-color="#DFE6DE"/>
      <stop offset="1" stop-color="#EDF1EA"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA69B"/>
      <stop offset="1" stop-color="#B5C4B8"/>
    </linearGradient>
    <linearGradient id="flat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A7B5A6"/>
      <stop offset="1" stop-color="#8C9A8B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="905" cy="352" r="46" fill="#C8863C" opacity="0.92"/>

  <!-- far shore -->
  <path d="M0 402 L150 396 L268 400 L402 391 L560 398 L742 392 L900 399 L1060 393 L1200 398 L1200 414 L0 414 Z" fill="#3C4F45" opacity="0.55"/>
  <path d="M0 414 h1200 v96 H0 Z" fill="url(#water)"/>

  <!-- sun reflection -->
  <g fill="#C8863C" opacity="0.5">
    <rect x="884" y="424" width="42" height="4"/>
    <rect x="872" y="440" width="66" height="4"/>
    <rect x="888" y="458" width="34" height="4"/>
    <rect x="866" y="476" width="78" height="3"/>
    <rect x="890" y="494" width="30" height="3"/>
  </g>

  <!-- tide lines on the draining flat -->
  <path d="M0 510 h1200 v390 H0 Z" fill="url(#flat)"/>
  <g stroke="#7F8D7E" fill="none" stroke-width="2" opacity="0.55">
    <path d="M-20 546 C 220 534, 470 560, 700 544 S 1080 556, 1220 540"/>
    <path d="M-20 596 C 260 582, 520 612, 760 592 S 1100 606, 1220 588"/>
    <path d="M-20 664 C 200 646, 500 682, 780 656 S 1090 674, 1220 650"/>
    <path d="M-20 754 C 240 730, 560 776, 820 742 S 1120 764, 1220 736"/>
  </g>

  <!-- cage rows, receding -->
  <g fill="#13201C">
    <g opacity="0.42">
      <rect x="120" y="536" width="26" height="9" rx="2"/><rect x="164" y="536" width="26" height="9" rx="2"/>
      <rect x="208" y="536" width="26" height="9" rx="2"/><rect x="252" y="536" width="26" height="9" rx="2"/>
      <rect x="296" y="536" width="26" height="9" rx="2"/><rect x="340" y="536" width="26" height="9" rx="2"/>
    </g>
    <g opacity="0.55">
      <rect x="88" y="592" width="38" height="13" rx="3"/><rect x="146" y="592" width="38" height="13" rx="3"/>
      <rect x="204" y="592" width="38" height="13" rx="3"/><rect x="262" y="592" width="38" height="13" rx="3"/>
      <rect x="320" y="592" width="38" height="13" rx="3"/><rect x="378" y="592" width="38" height="13" rx="3"/>
    </g>
    <g opacity="0.7">
      <rect x="52" y="676" width="58" height="19" rx="4"/><rect x="132" y="676" width="58" height="19" rx="4"/>
      <rect x="212" y="676" width="58" height="19" rx="4"/><rect x="292" y="676" width="58" height="19" rx="4"/>
      <rect x="372" y="676" width="58" height="19" rx="4"/>
    </g>
    <g opacity="0.85">
      <rect x="24" y="790" width="86" height="28" rx="6"/><rect x="134" y="790" width="86" height="28" rx="6"/>
      <rect x="244" y="790" width="86" height="28" rx="6"/><rect x="354" y="790" width="86" height="28" rx="6"/>
    </g>
  </g>

  <!-- skiff -->
  <g opacity="0.9">
    <path d="M690 624 h120 l-16 22 h-88 Z" fill="#13201C"/>
    <rect x="742" y="588" width="3" height="36" fill="#13201C"/>
  </g>
</svg>
