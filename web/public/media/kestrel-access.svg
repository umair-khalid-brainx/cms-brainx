<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" role="img" aria-label="Rope access rigging diagram with hub anchor, twin ropes and height markers">
  <rect width="900" height="1000" fill="#0E1116"/>

  <g stroke="#2A323C" stroke-width="1" opacity="0.85">
    <path d="M0 125 H900 M0 250 H900 M0 375 H900 M0 500 H900 M0 625 H900 M0 750 H900 M0 875 H900"/>
    <path d="M150 0 V1000 M300 0 V1000 M450 0 V1000 M600 0 V1000 M750 0 V1000"/>
  </g>

  <!-- tower -->
  <path d="M470 120 L560 120 L590 940 L440 940 Z" fill="#171C23" stroke="#3C4753" stroke-width="2"/>
  <path d="M498 120 L534 940" stroke="#2A323C" stroke-width="2" stroke-dasharray="12 10"/>

  <!-- nacelle and hub -->
  <path d="M446 78 h140 a14 14 0 0 1 14 14 v30 a14 14 0 0 1 -14 14 h-140 a14 14 0 0 1 -14 -14 v-30 a14 14 0 0 1 14 -14 Z" fill="#171C23" stroke="#3C4753" stroke-width="2"/>
  <circle cx="432" cy="107" r="15" fill="#0E1116" stroke="#FF6B1A" stroke-width="3"/>

  <!-- anchors -->
  <g fill="#FF6B1A">
    <path d="M452 136 l14 24 h-28 Z"/>
    <path d="M580 136 l14 24 h-28 Z"/>
  </g>

  <!-- twin ropes -->
  <path d="M452 158 C 430 380, 418 560, 404 742" fill="none" stroke="#FF6B1A" stroke-width="3"/>
  <path d="M580 158 C 604 380, 616 560, 630 742" fill="none" stroke="#8E9AAA" stroke-width="2" stroke-dasharray="9 7"/>

  <!-- technician at station -->
  <g>
    <rect x="382" y="470" width="44" height="44" fill="#FF6B1A"/>
    <path d="M404 514 v56" stroke="#FF6B1A" stroke-width="3"/>
    <path d="M426 492 h150" stroke="#F2C230" stroke-width="2"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#F2C230" letter-spacing="2">
    <text x="588" y="486">TECH 1</text>
    <text x="588" y="510" fill="#8E9AAA">ON ROPE</text>
  </g>

  <!-- height markers -->
  <g stroke="#3C4753" stroke-width="1.5">
    <path d="M120 158 H340 M120 366 H340 M120 574 H340 M120 782 H340 M120 940 H340"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#8E9AAA" letter-spacing="2">
    <text x="120" y="148">165 m</text>
    <text x="120" y="356">120 m</text>
    <text x="120" y="564">80 m</text>
    <text x="120" y="772">40 m</text>
    <text x="120" y="930" fill="#E6EAEF">GROUND</text>
  </g>

  <!-- exclusion zone -->
  <path d="M300 940 H740" stroke="#F2C230" stroke-width="3" stroke-dasharray="16 12"/>
  <text x="300" y="978" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#F2C230" letter-spacing="2">EXCLUSION ZONE · 20 m</text>
</svg>
