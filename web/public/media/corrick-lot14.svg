<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" role="img" aria-label="Survey drawing of Lot 14 showing cage rows and the low water contour">
  <rect width="1000" height="750" fill="#F1F4EF"/>

  <!-- survey grid -->
  <g stroke="#B6C2B5" stroke-width="1" opacity="0.7">
    <path d="M0 50 H1000 M0 150 H1000 M0 250 H1000 M0 350 H1000 M0 450 H1000 M0 550 H1000 M0 650 H1000"/>
    <path d="M100 0 V750 M200 0 V750 M300 0 V750 M400 0 V750 M500 0 V750 M600 0 V750 M700 0 V750 M800 0 V750 M900 0 V750"/>
  </g>

  <!-- lease boundary -->
  <path d="M96 104 L888 84 L910 626 L128 664 Z" fill="none" stroke="#2E4A3E" stroke-width="3"/>

  <!-- cage rows -->
  <g fill="#2E4A3E" opacity="0.82">
    <g>
      <rect x="150" y="160" width="112" height="16" rx="4"/><rect x="286" y="158" width="112" height="16" rx="4"/>
      <rect x="422" y="156" width="112" height="16" rx="4"/><rect x="558" y="154" width="112" height="16" rx="4"/>
      <rect x="694" y="152" width="112" height="16" rx="4"/>
    </g>
    <g>
      <rect x="150" y="248" width="112" height="16" rx="4"/><rect x="286" y="246" width="112" height="16" rx="4"/>
      <rect x="422" y="244" width="112" height="16" rx="4"/><rect x="558" y="242" width="112" height="16" rx="4"/>
      <rect x="694" y="240" width="112" height="16" rx="4"/>
    </g>
    <g>
      <rect x="152" y="336" width="112" height="16" rx="4"/><rect x="288" y="334" width="112" height="16" rx="4"/>
      <rect x="424" y="332" width="112" height="16" rx="4"/><rect x="560" y="330" width="112" height="16" rx="4"/>
      <rect x="696" y="328" width="112" height="16" rx="4"/>
    </g>
    <g opacity="0.5">
      <rect x="154" y="424" width="112" height="16" rx="4"/><rect x="290" y="422" width="112" height="16" rx="4"/>
      <rect x="426" y="420" width="112" height="16" rx="4"/><rect x="562" y="418" width="112" height="16" rx="4"/>
    </g>
  </g>

  <!-- mean low water contour -->
  <path d="M84 520 C 240 486, 380 546, 520 512 S 800 470, 936 508" fill="none" stroke="#C8863C" stroke-width="3" stroke-dasharray="14 9"/>
  <path d="M84 588 C 260 560, 420 612, 600 578 S 840 544, 936 576" fill="none" stroke="#C8863C" stroke-width="2" stroke-dasharray="6 8" opacity="0.6"/>

  <!-- annotations -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#13201C">
    <text x="96" y="72" letter-spacing="3">LOT 14</text>
    <text x="806" y="72" letter-spacing="2" fill="#556258">5.1 ac</text>
    <text x="716" y="500" fill="#C8863C" letter-spacing="2">MLW</text>
    <text x="150" y="700" fill="#556258" letter-spacing="2">ROWS 1—4 · 1,340 CAGES</text>
  </g>

  <!-- depth ticks -->
  <g stroke="#556258" stroke-width="2">
    <path d="M940 160 v40 M940 248 v40 M940 336 v40"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#556258">
    <text x="952" y="186">3.6m</text>
    <text x="952" y="274">2.9m</text>
    <text x="952" y="362">1.8m</text>
  </g>
</svg>
